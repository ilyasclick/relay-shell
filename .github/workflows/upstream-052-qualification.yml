name: upstream-052-qualification
on:
  pull_request:
    paths:
      - '.github/workflows/upstream-052-qualification.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Confirm exact candidate tree
        run: |
          test "$(git rev-parse HEAD^)" = "5da388ee71ba779e1cb939e69280c9966cf03533"
          git diff --exit-code HEAD^ HEAD -- src tests pyproject.toml requirements
      - name: Install isolated dependencies
        run: |
          python -m pip install -e '.[dev]' build
          python -m pip check
      - name: Full upstream tests including fuzz and security
        run: python -m pytest -m "" -q -rs
      - name: Classifier and audit negative regression suites
        run: python -m pytest -m "" -q -rs tests/test_policy.py tests/test_audit.py
      - name: Build and verify release wheel and isolated rollback
        run: |
          python -m build --wheel --sdist
          python -m venv "$RUNNER_TEMP/candidate"
          "$RUNNER_TEMP/candidate/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/candidate/bin/pip" check
          "$RUNNER_TEMP/candidate/bin/python" -c "import importlib.metadata as m; assert m.version('relay-shell') == '0.5.2'"
          python -m venv "$RUNNER_TEMP/rollback"
          "$RUNNER_TEMP/rollback/bin/pip" install 'git+https://github.com/ilyasclick/relay-shell.git@7e790ca633dad0b8c1632796104fe40d55866277'
          "$RUNNER_TEMP/rollback/bin/python" -c "import importlib.metadata as m; assert m.version('relay-shell') == '0.5.0'"
