name: Ruff formatter export
on:
  push:
    branches: [rdcx-ruff-format-20261106]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.17.2"
          args: "check --fix ."
      - name: Format and export
        run: |
          ruff format .
          git diff --binary > ruff-formatted.patch
      - uses: actions/upload-artifact@v4
        with:
          name: ruff-formatted-patch
          path: ruff-formatted.patch
